[package]
name = "dither-wasm"
version = "2.2.0"
edition = "2021"
description = "Dizako's dither engine compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# The rlib target drives native `cargo test` parity runs against the shared
# golden manifest; the engine itself avoids libm dependence so native and
# wasm32 agree bitwise (WASM_PLAN §4.4).
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# GitHub's macos-latest ships an old binaryen wasm-opt that rejects newer
# LLVM MVP multi-table wasm ("Only 1 table definition allowed"). Skip it;
# rustc release opts already apply.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
