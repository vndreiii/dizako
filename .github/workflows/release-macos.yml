name: Release macOS

# One-shot / on-demand macOS artifacts for an existing GitHub Release.
# Does not rebuild Linux or Windows.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v2.2.0)"
        required: true
        default: "v2.2.0"
  push:
    branches: [ci/macos-release]

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm + install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install

      - name: Build macOS bundles
        run: pnpm tauri build --bundles dmg,app

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp -v src-tauri/target/release/bundle/dmg/*.dmg dist-release/ || true
          cp -v src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/ || true
          cp -v src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/ || true
          ls -lh dist-release

      - name: Resolve tag name
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v2.2.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist-release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
