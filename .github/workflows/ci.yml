name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      # package.json depends on file:./dither-wasm/pkg — build that before pnpm install.
      - name: Build wasm engine
        run: wasm-pack build dither-wasm --release --target web --out-dir pkg
      - name: Install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          pnpm install
      - name: Lint
        run: pnpm lint
      - name: Typecheck + build
        run: pnpm exec tsc --noEmit && pnpm exec vite build
      # Gate: shipped wasm binary must reproduce the committed golden manifest.
      - name: Golden parity (wasm)
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dither-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --check || true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings || true
      # Gate 2 (native): the rlib engine against the same goldens.
      - name: Native parity tests
        run: cargo test --release

  desktop-linux:
    needs: [frontend, rust]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Build wasm + install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install
      - name: Patch AppImage bundler (strip bundled libwayland)
        run: ./packaging/patch-linuxdeploy-gtk.sh
      - name: Tauri build (deb, rpm, appimage)
        run: |
          pnpm tauri build --bundles deb,rpm
          NO_STRIP=1 pnpm tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  desktop-windows:
    needs: [frontend, rust]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm + install JS deps
        shell: pwsh
        run: |
          Set-Content -Path .npmrc -Value "strict-dep-builds=false"
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install
      - name: Tauri build (nsis)
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: src-tauri/target/release/bundle/nsis/*.exe

  desktop-macos:
    needs: [frontend, rust]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm + install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install
      - name: Tauri build (dmg, app)
        run: pnpm tauri build --bundles dmg,app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
