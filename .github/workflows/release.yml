name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.2.0). Leave empty to use the latest tag on the default branch tip."
        required: false
        default: ""

permissions:
  contents: write

env:
  # Free Tauri minisign key (not Windows Authenticode / Apple notarization).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Build wasm + install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install

      - name: Patch AppImage bundler (strip bundled libwayland)
        run: ./packaging/patch-linuxdeploy-gtk.sh

      - name: Build Linux bundles
        # createUpdaterArtifacts is on, but Linux is omitted from latest.json.
        # Signing env is still needed so the build does not fail looking for a key.
        run: |
          pnpm tauri build --bundles deb,rpm
          NO_STRIP=1 pnpm tauri build --bundles appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp -v src-tauri/target/release/bundle/deb/*.deb dist-release/ || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm dist-release/ || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist-release/ || true
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm + install JS deps
        shell: pwsh
        run: |
          Set-Content -Path .npmrc -Value "strict-dep-builds=false"
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item -Force src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/
          Copy-Item -Force src-tauri/target/release/bundle/nsis/*-setup.exe.sig dist-release/
          if (Test-Path src-tauri/target/release/dizako.exe) {
            Copy-Item -Force src-tauri/target/release/dizako.exe dist-release/
          }
          Get-ChildItem dist-release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build wasm + install JS deps
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          wasm-pack build dither-wasm --release --target web --out-dir pkg
          pnpm install

      - name: Build macOS bundles
        # dmg = manual install; .app.tar.gz (+ .sig) = updater payload.
        # Unsigned — Gatekeeper still warns without a paid Apple Developer ID.
        run: pnpm tauri build --bundles dmg,app

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp -v src-tauri/target/release/bundle/dmg/*.dmg dist-release/ || true
          cp -v src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/
          cp -v src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist-release/*

  publish:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build latest.json for updater
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          version="${tag#v}"
          base="https://github.com/vndreiii/dizako/releases/download/${tag}"
          pub_date="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          shopt -s nullglob
          win_exe=(artifacts/*-setup.exe)
          win_sig=(artifacts/*-setup.exe.sig)
          mac_tgz=(artifacts/*.app.tar.gz)
          mac_sig=(artifacts/*.app.tar.gz.sig)

          if [[ ${#win_exe[@]} -lt 1 || ${#win_sig[@]} -lt 1 ]]; then
            echo "missing Windows updater artifacts" >&2
            ls -la artifacts >&2 || true
            exit 1
          fi
          if [[ ${#mac_tgz[@]} -lt 1 || ${#mac_sig[@]} -lt 1 ]]; then
            echo "missing macOS updater artifacts" >&2
            ls -la artifacts >&2 || true
            exit 1
          fi

          jq -n \
            --arg version "$version" \
            --arg notes "Dizako ${version}" \
            --arg pub_date "$pub_date" \
            --arg win_url "$base/$(basename "${win_exe[0]}")" \
            --arg win_sig "$(cat "${win_sig[0]}")" \
            --arg mac_url "$base/$(basename "${mac_tgz[0]}")" \
            --arg mac_sig "$(cat "${mac_sig[0]}")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig }
              }
            }' > artifacts/latest.json
          cat artifacts/latest.json

      - name: Replace previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets -q '.assets[].name' | while read -r name; do
              [[ -n "$name" ]] || continue
              gh release delete-asset "$tag" "$name" -y || true
            done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Dizako ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
