name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.1.0). Leave empty to use the latest tag on the default branch tip."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - name: Install JS deps + wasm
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          pnpm install
          pnpm build:wasm

      - name: Build Linux bundles
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          cp -v src-tauri/target/release/bundle/deb/*.deb dist-release/ || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm dist-release/ || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist-release/ || true
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install JS deps + wasm
        shell: bash
        run: |
          printf 'strict-dep-builds=false\n' > .npmrc
          pnpm install
          pnpm build:wasm

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          cp -v src-tauri/target/release/bundle/nsis/*.exe dist-release/ || true
          # Portable binary next to the installer when present
          if [[ -f src-tauri/target/release/dizako.exe ]]; then
            cp -v src-tauri/target/release/dizako.exe dist-release/
          fi
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-release/*

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Dizako ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
